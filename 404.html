<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
      var l = window.location;

      // ── 1. /reports/archive/* → /reports/masters/* ────────────────────────
      //
      // The Master's work lived under archive/ until 2026-10-11, when it was
      // renamed (it is the ground the PhD stands on, not deadwood). GitHub Pages
      // cannot serve a 301, so the old URLs are held open here instead: every one
      // of them 404s onto this page and is rewritten client-side.
      //
      // Most of it is a prefix swap, because ddcm/, thesis/ and the figure and
      // presentation folders kept their names. The 14 meeting notes are the
      // exception — they were renamed to YYYY-MM-DD-slug AND lifted out of their
      // 2025-fall / 2026-spring folders, so a prefix swap would miss them. They
      // are mapped on the YYMMDD prefix of the old slug, which survives whatever
      // percent-encoding the browser applied to the commas and parentheses in the
      // old filenames.
      var a = l.pathname.match(/^\/reports\/archive\/(.*)$/);
      if (a) {
        var rest = a[1];
        var notes = {
          "251008": "2025-10-08-pumcm-perturbed-utility",
          "251015": "2025-10-15-td-estimation-ideas",
          "251104": "2025-11-04-readings-and-implementation-plans",
          "251109": "2025-11-09-smaso-x-presentation",
          "251126": "2025-11-26-tensor-gpu-implementation",
          "251215": "2025-12-15-documentation-and-reframework",
          "251224": "2025-12-24-universal-graph-and-bi-optimization",
          "260107": "2026-01-07-rmdp-theory-and-implementation",
          "260127": "2026-01-27-validation-plan",
          "260419": "2026-04-19-thesis-progress-april",
          "260427": "2026-04-27-gradient-masks-and-c-change",
          "260511": "2026-05-11-k10-results-and-work-start-timing",
          "260601": "2026-06-01-gradient-investigation-resolved",
          "260623": "2026-06-23-recovery-and-approximation-error"
        };
        var note = rest.match(/^meetings\/[^/]+\/(\d{6})[^/]*$/);
        var asset = rest.match(/^meetings\/20\d\d-(?:fall|spring)\/(presentations|figures)\/(.+)$/);
        if (note && notes[note[1]]) {
          rest = "meetings/" + notes[note[1]] + ".html";
        } else if (asset) {
          // the two semester folders merged, so their presentations/ and figures/
          // subfolders now sit directly under meetings/
          rest = "meetings/" + asset[1] + "/" + asset[2];
        } else if (/^meetings\/20\d\d-(?:fall|spring)\/?$/.test(rest)) {
          // the per-semester folder listings no longer exist
          rest = "meetings/";
        }
        l.replace("/reports/masters/" + rest + l.search + l.hash);
      }

      // ── 1b. Renamed PhD pages ─────────────────────────────────────────────
      //
      // The two PhD reports were renamed to date-prefixed slugs on 2026-10-13 (the explorer reads
      // the date from the slug), and the Paper A page was folded into its deck. Their old URLs had
      // been live, so they are held open here.
      var moved = {
        "/reports/phd/paper-a": "/reports/slides/constraint-framing/",
        "/reports/phd/supervisor-deck": "/reports/phd/2026-10-13-paper-a-deck",
        "/reports/phd/cpu-speedup": "/reports/phd/2026-10-13-gradient-speedup"
      };
      var movedTo = moved[l.pathname.replace(/(?:\.html|\/)$/, "")];
      if (movedTo) {
        l.replace(movedTo + l.search + l.hash);
      }

      // ── 2. Slidev deck deep links ─────────────────────────────────────────
      //
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      //
      // The Slidev decks under slides/<name>/ are client-side-routed SPAs (Vue Router,
      // history mode: paths like /reports/slides/apte/1). GitHub Pages has no server-side
      // rewrite, so a direct link or a page refresh on any slide other than the first hits
      // this 404 page. If the path falls under slides/<name>/, redirect into that deck's
      // index.html with the intended path preserved in a query string; the deck's index.html
      // has a matching decoder snippet that restores it via history.replaceState before the
      // router boots. Anything outside slides/ (thesis notes, meetings, etc.) falls through
      // to this plain page — those are real 404s, not SPA routes.
      var m = l.pathname.match(/^(\/reports\/slides\/[^/]+\/)(.*)$/);
      if (m) {
        var base = m[1];
        var rest2 = m[2];
        l.replace(
          base + "?/" + rest2.replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
