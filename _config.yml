title: Azwan Nazamuddin — Research Reports
description: PhD research on DDCM for activity-based travel demand · Hiroshima University
plugins:
  - jekyll-relative-links

# Jekyll excludes any file/folder starting with "_" by default. Slidev/Vite builds under
# slides/ emit underscore-prefixed files (e.g. assets/_plugin-vue_export-helper-*.js,
# _redirects) that must ship as-is or the deck fails to load (blank page, 404'd JS module).
include:
  - "_redirects"
  - "_*.js"
  - "_*.css"

# The site is being migrated to Quartz. Until GitHub Pages is switched from the
# legacy Jekyll build to an Actions workflow, Jekyll still builds this repo, so
# keep it away from the Quartz toolchain and sources.
exclude:
  - node_modules
  - public
  - quartz
  - content
  - quartz.ts
  - quartz.config.yaml
  - package.json
  - package-lock.json
  - tsconfig.json
  - globals.d.ts
  - index.d.ts
